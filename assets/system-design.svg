<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="800" viewBox="0 0 1970 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="985" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#222">CODETRACE: High-Level Design</text>
<path d="M200,325 L380,325" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="205" y="308" width="170" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="290" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#222">1  connect, pick commits</text>
<text x="290" y="336" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(GitHub URL or local path)</text>
<path d="M380,375 L200,375" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="214" y="358" width="152" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="290" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#222">10  view results</text>
<text x="290" y="386" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(graph, risk, Markdown)</text>
<path d="M580,325 L750,325" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="604" y="308" width="122" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="665" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#222">2  REST request</text>
<text x="665" y="336" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(connect, analyse)</text>
<path d="M750,375 L580,375" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="598" y="358" width="134" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="665" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#222">9  REST response</text>
<text x="665" y="386" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(graph, report JSON)</text>
<path d="M820,400 L820,560" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="738" y="431" width="164" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="820" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#222">3  record the job</text>
<text x="820" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(repository, job: QUEUED)</text>
<path d="M870,300 L870,160" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="821" y="213" width="98" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="870" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#222">4  enqueue job</text>
<text x="870" y="241" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(job id)</text>
<path d="M1360,160 L1360,300" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1284" y="213" width="152" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="1360" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#222">5  deliver job</text>
<text x="1360" y="241" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(job id, at least once)</text>
<path d="M1495,350 L1710,350" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1511.5" y="333" width="182" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="1602.5" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#222">6  fetch commits, read files</text>
<text x="1602.5" y="361" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(HTTPS clone or /repos path)</text>
<path d="M1360,400 L1360,560" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1260" y="463" width="200" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="1360" y="477" text-anchor="middle" font-size="11" font-weight="700" fill="#222">7  store results</text>
<text x="1360" y="491" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(symbols, graph, impact report)</text>
<path d="M930,560 L930,400" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="857" y="495" width="146" height="34" rx="3" fill="#fff" fill-opacity="0.95"/>
<text x="930" y="509" text-anchor="middle" font-size="11" font-weight="700" fill="#222">8  read results</text>
<text x="930" y="523" text-anchor="middle" font-size="11" font-weight="400" fill="#555">(graph, impact report)</text>
<rect x="40" y="300" width="160" height="100" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
<text x="120" y="345.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Developer</text>
<text x="120" y="363.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">or reviewer</text>
<rect x="380" y="300" width="200" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="480" y="336.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Web dashboard</text>
<text x="480" y="354.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">Next.js</text>
<text x="480" y="372.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">connect · explore · review</text>
<rect x="750" y="300" width="240" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="870" y="336.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">API service</text>
<text x="870" y="354.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">Spring Boot</text>
<text x="870" y="372.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">validates · queues · serves results</text>
<rect x="1225" y="300" width="270" height="100" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="1360" y="336.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Worker service</text>
<text x="1360" y="354.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">Spring Boot</text>
<text x="1360" y="372.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">indexes · builds graphs · analyses changes</text>
<rect x="1710" y="300" width="220" height="100" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
<text x="1820" y="336.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Git repositories</text>
<text x="1820" y="354.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">GitHub, GitLab, Bitbucket</text>
<text x="1820" y="372.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">or local folders</text>
<rect x="790" y="80" width="650" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="1115" y="115.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Redis Streams</text>
<text x="1115" y="133.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">job queue (carries only job ids)</text>
<rect x="790" y="560" width="650" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="1115" y="596.55" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">PostgreSQL</text>
<text x="1115" y="614.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">source of truth: repositories, jobs,</text>
<text x="1115" y="632.55" text-anchor="middle" font-size="13" font-weight="400" fill="#222222">dependency graphs, impact reports</text>
<text x="40" y="713" text-anchor="start" font-size="13" font-weight="700" fill="#333333">Flow: connect a repository → the API records a job and queues its id → the worker reads the code from Git, builds the dependency graph and the impact report → the dashboard shows them.</text>
<text x="40" y="748" text-anchor="start" font-size="13" font-weight="400" fill="#555555">PostgreSQL is the source of truth, and Redis only says “look at job X”.   Repository code is read as text and never executed.   Published graphs and completed reports are immutable.</text>
</svg>