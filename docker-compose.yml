name: codetrace

x-backend-env: &backend-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codetrace}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codetrace}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  CODETRACE_CORS_ORIGINS: ${CODETRACE_CORS_ORIGINS:-http://localhost:3000}
  # LOCAL repositories must live under this (read-only) mount. See scripts/make-demo-repo.*
  CODETRACE_INGESTION_LOCAL_ROOTS: /repos

x-local-repos: &local-repos ${CODETRACE_LOCAL_REPOS_DIR:-./data/local-repos}:/repos:ro

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codetrace}
      POSTGRES_USER: ${POSTGRES_USER:-codetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetrace} -d ${POSTGRES_DB:-codetrace}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: api
    volumes:
      - *local-repos
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build: ./backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
    volumes:
      - *local-repos
      - workspaces:/data/workspaces   # bare clones of remote repositories
    ports:
      - "127.0.0.1:${WORKER_MANAGEMENT_PORT:-8081}:8081"   # actuator health only, no REST API
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # ---- optional monitoring tools: docker compose --profile tools up -d ----

  # Browse the job streams (codetrace:jobs, codetrace:jobs:dead), the consumer group and pending messages.
  redisinsight:
    image: redis/redisinsight:2.70
    profiles: ["tools"]
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: codetrace
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"   # local dev tool; also turns analytics off
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy

  # Live logs of every container in this project (worker job progress, API requests).
  dozzle:
    image: amir20/dozzle:v8.13
    profiles: ["tools"]
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=codetrace
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  workspaces:
  redisinsight:
