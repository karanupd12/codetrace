spring:
  application:
    name: codetrace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codetrace}
    username: ${SPRING_DATASOURCE_USERNAME:codetrace}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

codetrace:
  cors-origins: ${CODETRACE_CORS_ORIGINS:http://localhost:3000}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
